name: Release Tip

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      TIP_TAG: tip
      TIP_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TIP_COMMIT }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile

      - name: Prepare a unique, aligned prerelease
        run: |
          base_version="$(node -p "require('./packages/sdk/package.json').version.split('-')[0]")"
          version="$base_version-tip.${{ github.run_id }}.${{ github.run_attempt }}"
          echo "NORN_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          pnpm release:prepare "$version" "$TIP_COMMIT"

      - run: pnpm check
      - run: pnpm test
      - run: node scripts/pack-packages.ts

      - name: Build standalone binaries
        run: |
          set -euo pipefail
          mkdir -p dist/release
          build_binary() {
            target="$1"
            output="$2"
            pnpm release:prepare "$NORN_RELEASE_VERSION" "$TIP_COMMIT" "$output"
            pnpm documentation:generate
            pnpm exec bun build --compile --target="$target" ./packages/cli/src/bun/cli.ts --outfile "dist/release/$output"
            chmod +x "dist/release/$output"
          }
          build_binary bun-linux-x64 norn-linux-x64
          build_binary bun-linux-arm64 norn-linux-arm64
          build_binary bun-darwin-x64 norn-darwin-x64
          build_binary bun-darwin-arm64 norn-darwin-arm64
          build_binary bun-windows-x64 norn-windows-x64.exe
          cp scripts/install.sh dist/release/install.sh
          chmod +x dist/release/install.sh
          cd dist/release
          artifacts=(norn-* install.sh)
          for file in "${artifacts[@]}"; do sha256sum "$file" > "$file.sha256"; done
          sha256sum "${artifacts[@]}" > SHA256SUMS.txt

      - name: Reject superseded builds before publication
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TIP_COMMIT"

      - name: Publish and verify npm tip packages using OIDC
        run: pnpm release:publish --trusted

      - name: Point the GitHub tip tag at the released commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -fa "$TIP_TAG" -m "Norn $NORN_RELEASE_VERSION" "$TIP_COMMIT"
          git push --force origin "refs/tags/$TIP_TAG"

      - name: Publish standalone tip release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Automated prerelease `%s` for `%s`.\n\nMatching npm packages are available under the `tip` tag.\n' "$NORN_RELEASE_VERSION" "$TIP_COMMIT" > dist/release-notes.md
          if gh release view "$TIP_TAG" >/dev/null 2>&1; then
            gh release edit "$TIP_TAG" --title "Norn Tip" --notes-file dist/release-notes.md --prerelease --latest=false
            gh release upload "$TIP_TAG" dist/release/* --clobber
            gh release view "$TIP_TAG" --json assets --jq '.assets[].name | select(. == "norn-tip.tgz" or . == "norn-tip.tgz.sha256")' | while IFS= read -r asset; do
              gh release delete-asset "$TIP_TAG" "$asset" --yes
            done
          else
            gh release create "$TIP_TAG" dist/release/* --title "Norn Tip" --notes-file dist/release-notes.md --prerelease --latest=false
          fi
